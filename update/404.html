<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 页面未找到</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #4f46e5;
            --accent-light: #6366f1;
            --bg: #faf9f7;
            --text: #1a1817;
            --text-secondary: #6b6560;
            --border: #e7e3de;
        }
        .dark-mode {
            --bg: #0d0c0b;
            --text: #f0ede8;
            --text-secondary: #a09a93;
            --border: #2d2a26;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100dvh; text-align: center;
            transition: background 0.4s ease, color 0.4s ease;
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat; background-size: 256px 256px;
        }
        .wrapper { max-width: 520px; padding: 48px 24px; position: relative; z-index: 1; }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(5rem, 15vw, 8rem);
            font-weight: 700; color: var(--accent);
            line-height: 1; margin-bottom: 16px;
        }
        h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 600; margin-bottom: 12px; }
        p { font-size: 1rem; color: var(--text-secondary); margin-bottom: 32px; text-wrap: pretty; }
        .home-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 50px;
            background: var(--accent); color: #fff;
            text-decoration: none; font-weight: 500;
            font-size: 0.95rem; transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }
        .home-link:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35); }
        .home-link:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="code">404</div>
        <h1>页面未找到</h1>
        <p>您访问的页面不存在或已被移动。<br>请检查链接是否正确，或返回首页。</p>
        <a href="index.html" class="home-link">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
    </div>
</body>
</html>
